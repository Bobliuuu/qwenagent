intro: |
  <a id="video"></a>
  Agent frameworks get "subagents" by calling a model again and again from the outside. Here the subagent-like modules live **inside one forward pass**:
  at the output of layer 12 of a frozen Qwen3-0.6B, K small neural workers each own a private recurrent (GRU) state, a learned router decides per token
  which worker absorbs it, and the workers' states are decoded and **added back into the residual stream before layers 13-27**. Only the workers are trained.

  The test is **interleaved register programs**: P registers each get a private stream of arithmetic ops (mod 10), shuffled into one token stream, and the model reports one register's final value.
  Training uses 2-3 registers; testing goes to 16. Chance is {{ n.chance }}.

  > **Headline.** Embedding trainable stateful modules in a frozen LM works (frozen Qwen is at {{ n.frozen }}; zeroing the return channel sends every mode back to chance),
  > but **private slots are not a win**: a stateless adapter and a single shared state do as well or better, and the slot version is less stable across seeds.

video:
  url: ""
  caption: "Explainer video (voice-over and subtitles): the idea, the task, the results, and the honest null result"
  mp4: video/qwenagent_explainer.mp4
  gif: video/preview.gif
  srt: video/qwenagent_explainer.srt
  poster: video/poster.png
  out_dir: video/.render
  fps: 24
  max_mb: 22
  render_crf: 18
  poster_at: 40
  music: true
  voice: {engine: openai, voice: alloy, model: gpt-4o-mini-tts, tempo: 1.2}
  scenes:
    - type: title
      title: qwenagent
      subtitle: "Subagents inside a frozen Qwen forward pass"
      chips: [frozen Qwen3, stateful workers, learned router]
      say: "qwenagent. Can subagent like modules live inside a single forward pass of a frozen Qwen? This is a short tour of the idea, the task, what worked, and what did not."
    - type: problem
      heading: "The question"
      bullets:
        - "Agent frameworks call a model again and again from outside"
        - "Here the workers live inside one forward pass"
        - "Private state per worker, a learned router, no prompts"
        - "Does routing to private slots help state tracking?"
      say: "Agent frameworks get subagents by calling a model over and over from the outside. Here the workers live inside one forward pass. Each owns a private recurrent state, a learned router decides which worker sees each token, and no prompts or tool calls are involved. The question is whether routing to private slots actually helps state tracking."
    - type: architecture
      diagram: arch
      heading: "Workers tapped into layer 12"
      say: "At layer twelve of a frozen Qwen three, the residual stream feeds a router and K slot states, each a small GRU. A return network decodes the slots and adds the result back into the residual stream before layers thirteen to twenty seven. Only the workers are trained."
    - type: idea
      heading: "The task: interleaved register programs"
      bullets:
        - "P registers, each with its own stream of ops mod 10"
        - "All streams shuffled into one token stream"
        - "Query one register: chance is {{ n.chance.text }}"
        - "Train on 2-3 registers, test on 2 to 16"
      say: "The task is interleaved register programs. Each register has its own stream of arithmetic operations, all shuffled together, and the model must report one register's final value. Chance is {{ n.chance.numtext }} percent. We train on two or three registers and test up to sixteen."
    - type: chart
      chart: curve
      say: "Frozen Qwen alone sits at chance. With workers attached, accuracy at two registers is about {{ n.ad_p2.numtext }} percent for the stateless adapter, {{ n.si_p2.numtext }} for a single shared state, and {{ n.mu_p2.numtext }} for the routed slots. By sixteen registers they all fall to roughly {{ n.mu_p16.numtext }} to {{ n.ad_p16.numtext }} percent. Five seeds per cell, with random register names."
    - type: results
      heading: "Do the slots matter? Mean accuracy over P = 2 to 16"
      items:
        - {label: "stateless adapter", number: mean_ad}
        - {label: "learned-router slots (multi)", number: mean_mu}
        - {label: "parameter-matched LoRA", number: mean_lora}
      say: "Averaged over two to sixteen registers, the stateless adapter reaches {{ n.mean_ad.numtext }} percent, the routed slots {{ n.mean_mu.numtext }}, and a parameter matched LoRA {{ n.mean_lora.numtext }}. The private slots do not beat the simpler baselines."
    - type: chart
      chart: zero
      say: "The workers are doing real work, though. If the return channel is zeroed at test time, every mode drops back to about {{ n.zero_mu.numtext }} percent, which is chance. The answer flows through the injected modules."
    - type: stat
      number: pur4
      kicker: "router purity at P = 4, mean over 5 seeds"
      label: "of tokens routed to the right slot"
      sub: "yet that does not turn into an accuracy advantage"
      say: "The learned router really does bind registers to slots, with about {{ n.pur4.numtext }} percent purity on average, but one seed sits near fifty four. Clean routing does not turn into an accuracy edge."
    - type: chart
      chart: scale
      say: "Scale helps a lot. At sixteen registers on Qwen three four B, the adapter reaches {{ n.s4_ad.numtext }} percent and the single state {{ n.s4_si.numtext }}, while the routed slots fall behind at {{ n.s4_mu.numtext }}."
    - type: caveats
      heading: "Honest caveats"
      bullets:
        - "One task family, toy scale; 2 to 5 seeds per cell"
        - "No tuned-LoRA claim: no learning rate sweep"
        - "Long op chains per register: every mode collapses"
        - "Private slots are NOT shown to help"
      say: "Caveats. One task family at toy scale, with two to five seeds per cell. No best tuned LoRA claim was made. Every mode collapses when each register gets long operation chains. And the main claim, that private slots help, is not supported by the data."
    - type: end
      title: qwenagent
      subtitle: "Code, results and logs are in the repo"
      say: "Code, results and logs are in the repo."

